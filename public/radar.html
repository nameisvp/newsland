<!DOCTYPE html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Brokerage Radar | Newsland</title>
  <meta name="description" content="Latest institutional stock recommendations, target prices, and analyst ratings for Indian & global markets.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
  <style>
    .radar-wrap {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 0 1.25rem 4rem;
    }

    /* Header */
    .radar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .radar-brand {
      display: flex;
      align-items: baseline;
      gap: 0.55rem;
      text-decoration: none;
      color: inherit;
    }

    .radar-logo {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--ink);
    }

    .radar-dot { color: var(--accent); }

    .radar-tag {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--tag-bg);
      color: var(--accent);
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .radar-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .r-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 5px 12px;
      border-radius: 18px;
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      background: var(--card-bg);
      color: var(--ink);
      border: 1px solid var(--border);
      transition: all 0.14s ease;
    }

    .r-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .r-btn.primary {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    .r-btn.primary:hover {
      opacity: 0.88;
      color: var(--bg);
    }

    /* Compact Pulse Strip */
    .radar-pulse-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      padding: 0.65rem 0.9rem;
      margin: 1rem 0 0.9rem;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 0.8rem;
    }

    .pulse-metrics {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .pulse-item {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--ink-secondary);
      font-weight: 500;
    }

    .pulse-item strong {
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    .pulse-item.bull strong { color: var(--green-ticker); }
    .pulse-item.bear strong { color: var(--red-ticker); }

    .pulse-updated {
      font-size: 0.75rem;
      color: var(--ink-muted);
      font-family: var(--font-mono);
    }

    /* Toolbar: Search + Sentiment Pills */
    .radar-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }

    .radar-search-box {
      position: relative;
      flex: 1 1 280px;
      max-width: 440px;
    }

    .radar-search-input {
      width: 100%;
      padding: 8px 34px 8px 14px;
      font-size: 0.85rem;
      font-family: var(--font-sans);
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--card-bg);
      color: var(--ink);
      outline: none;
      box-sizing: border-box;
    }

    .radar-search-input:focus {
      border-color: var(--accent);
    }

    .radar-search-ico {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.8rem;
      color: var(--ink-muted);
      pointer-events: none;
    }

    .radar-sent-pills {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .radar-sent-pills::-webkit-scrollbar { display: none; }

    .r-pill {
      white-space: nowrap;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.78rem;
      font-weight: 600;
      font-family: var(--font-sans);
      background: var(--card-bg);
      color: var(--ink-secondary);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .r-pill:hover {
      border-color: var(--ink);
      color: var(--ink);
    }

    .r-pill.active {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    /* Brokerage Chips Bar */
    .radar-firms-bar {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      overflow-x: auto;
      padding-bottom: 0.65rem;
      margin-bottom: 0.5rem;
      scrollbar-width: none;
    }
    .radar-firms-bar::-webkit-scrollbar { display: none; }

    .firm-chip {
      white-space: nowrap;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.74rem;
      font-weight: 500;
      font-family: var(--font-sans);
      background: transparent;
      color: var(--ink-muted);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .firm-chip:hover, .firm-chip.active {
      background: var(--tag-bg);
      color: var(--ink);
      border-color: var(--ink-secondary);
      font-weight: 600;
    }

    /* Institutional Table Layout */
    .radar-table-wrap {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .radar-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-sans);
      text-align: left;
    }

    .radar-table thead th {
      background: var(--bg-subtle);
      color: var(--ink-muted);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.65rem 0.9rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      user-select: none;
    }

    .radar-table thead th.sortable {
      cursor: pointer;
    }
    .radar-table thead th.sortable:hover {
      color: var(--ink);
    }

    .radar-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s ease;
    }

    .radar-table tbody tr:last-child {
      border-bottom: none;
    }

    .radar-table tbody tr:hover {
      background: var(--bg-subtle);
    }

    .radar-table td {
      padding: 0.78rem 0.9rem;
      vertical-align: middle;
      font-size: 0.86rem;
      color: var(--ink);
    }

    /* Table Cell Components */
    .col-broker { width: 135px; white-space: nowrap; }
    .col-stock { width: 175px; }
    .col-reco { width: 130px; white-space: nowrap; }
    .col-target { width: 110px; white-space: nowrap; }
    .col-details { min-width: 280px; }
    .col-meta { width: 135px; text-align: right; white-space: nowrap; }

    .firm-pill {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--tag-bg);
      color: var(--ink);
      border: 1px solid var(--border);
    }

    .stock-cell {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .stock-name {
      font-weight: 700;
      color: var(--ink);
      font-size: 0.88rem;
    }

    .xray-mini-link {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid rgba(217, 68, 31, 0.3);
      opacity: 0.85;
    }
    .xray-mini-link:hover {
      opacity: 1;
      background: rgba(217, 68, 31, 0.08);
    }

    .reco-badge {
      display: inline-flex;
      align-items: center;
      font-size: 0.74rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .reco-badge.bullish { background: rgba(0, 135, 90, 0.12); color: var(--green-ticker); }
    .reco-badge.bearish { background: rgba(222, 53, 11, 0.12); color: var(--red-ticker); }
    .reco-badge.neutral { background: var(--tag-bg); color: var(--ink-secondary); }

    .target-val {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--ink);
    }
    .target-empty {
      color: var(--ink-muted);
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }

    .detail-headline {
      display: block;
      color: var(--ink);
      text-decoration: none;
      font-weight: 500;
      line-height: 1.38;
    }
    .detail-headline:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .meta-source {
      display: block;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--ink-secondary);
      text-decoration: none;
    }
    .meta-source:hover {
      color: var(--accent);
    }
    .meta-time {
      display: block;
      font-size: 0.72rem;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .radar-empty-row td {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--ink-muted);
    }

    /* Mobile Responsive List Transformation */
    @media (max-width: 820px) {
      .radar-wrap { padding: 0 0.75rem 3rem; }

      .radar-table thead { display: none; }
      .radar-table, .radar-table tbody, .radar-table tr, .radar-table td {
        display: block;
        width: 100%;
        box-sizing: border-box;
      }

      .radar-table tbody tr {
        padding: 0.9rem 0.95rem;
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-areas:
          "broker reco"
          "stock target"
          "details details"
          "meta meta";
        gap: 0.35rem 0.65rem;
        align-items: center;
      }

      .radar-table td {
        padding: 0;
        border: none;
        width: auto !important;
        min-width: 0 !important;
        text-align: left !important;
      }

      .col-broker { grid-area: broker; }
      .col-reco { grid-area: reco; justify-self: end; }
      .col-stock { grid-area: stock; margin-top: 2px; }
      .col-target { grid-area: target; justify-self: end; }
      .col-details { grid-area: details; margin-top: 4px; }
      .col-meta {
        grid-area: meta;
        display: flex !important;
        align-items: center;
        justify-content: space-between;
        margin-top: 6px;
        padding-top: 6px !important;
        border-top: 1px dashed var(--border) !important;
      }
      .meta-time { margin-top: 0; }
    }
  </style>
</head>
<body>
  <div class="radar-wrap">
    <!-- Top Header -->
    <header class="radar-header">
      <a href="index.html" class="radar-brand">
        <span class="radar-logo">newsland<span class="radar-dot">.</span></span>
        <span class="radar-tag">BROKERAGE RADAR</span>
      </a>
      <div class="radar-actions">
        <button id="theme-btn" class="r-btn" title="Switch Theme">🌓 Theme</button>
        <button id="refresh-btn" class="r-btn" title="Sync Latest Calls">↻ Refresh</button>
        <a href="index.html" class="r-btn primary">← Desk Briefing</a>
      </div>
    </header>

    <!-- Compact 1-Line Pulse Strip -->
    <section class="radar-pulse-bar">
      <div class="pulse-metrics">
        <span class="pulse-item">Calls: <strong id="stat-total">--</strong></span>
        <span class="pulse-item bull">Buys / Upgrades: <strong id="stat-bullish">--</strong></span>
        <span class="pulse-item bear">Sells / Cuts: <strong id="stat-bearish">--</strong></span>
        <span class="pulse-item">Neutral: <strong id="stat-neutral">--</strong></span>
      </div>
      <span id="stat-updated" class="pulse-updated">Syncing…</span>
    </section>

    <!-- Search & Filter Toolbar -->
    <section class="radar-toolbar">
      <div class="radar-search-box">
        <input id="radar-search" type="search" class="radar-search-input" placeholder="Filter by stock (MRF, Tata Steel) or brokerage (Citi, UBS)..." autocomplete="off">
        <span class="radar-search-ico">🔍</span>
      </div>

      <div class="radar-sent-pills">
        <button class="r-pill active" data-action="all">All (<span id="count-all">0</span>)</button>
        <button class="r-pill" data-action="bullish">🟢 Buys / Upgrades (<span id="count-bull">0</span>)</button>
        <button class="r-pill" data-action="bearish">🔴 Sells / Cuts (<span id="count-bear">0</span>)</button>
        <button class="r-pill" data-action="neutral">🟡 Hold / Note (<span id="count-neutral">0</span>)</button>
      </div>
    </section>

    <!-- Brokerage Firm Filter Chips -->
    <div id="broker-chips-row" class="radar-firms-bar">
      <button class="firm-chip active" data-broker="all">All Brokerages</button>
    </div>

    <!-- Institutional Table / Mobile List -->
    <main class="radar-table-wrap">
      <table class="radar-table" aria-label="Brokerage Recommendations">
        <thead>
          <tr>
            <th class="col-broker sortable" data-sort="brokerage">Brokerage ⇅</th>
            <th class="col-stock sortable" data-sort="stock">Stock ⇅</th>
            <th class="col-reco sortable" data-sort="action_label">Recommendation ⇅</th>
            <th class="col-target">Target</th>
            <th class="col-details">Details</th>
            <th class="col-meta sortable" data-sort="published">Source / Time ⇅</th>
          </tr>
        </thead>
        <tbody id="radar-tbody">
          <tr class="radar-empty-row">
            <td colspan="6">Loading brokerage recommendations…</td>
          </tr>
        </tbody>
      </table>
    </main>
  </div>

  <script src="radar.js"></script>
</body>
</html>
