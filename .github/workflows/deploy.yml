name: Newsland Autopilot - News & Market Collector

on:
  schedule:
    # Run hourly on weekdays during Indian market & briefing hours (02:00 to 12:00 UTC = 7:30 AM to 5:30 PM IST)
    - cron: '0 2-12 * * 1-5'
    # Weekend morning briefing at 04:00 UTC (9:30 AM IST) on Saturday & Sunday
    - cron: '0 4 * * 0,6'
  workflow_dispatch: # Allows manual 1-click "Run workflow" in GitHub Actions tab anytime
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'build_static.py'
      - 'server.py'
      - 'requirements.txt'

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect News & Market Data (Build Static)
        run: |
          python build_static.py

      - name: Commit and push fresh data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ public/data/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated briefing & market refresh [skip actions]"
            git push
          fi
